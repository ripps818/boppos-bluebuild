name: boppos-bluebuild
description: "BoppOS based on Bazzite-dx, optimized for AMD Hardware"
base-image: ghcr.io/ublue-os/bazzite-dx
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - build-tuned.sh

  # Bazzite 45+ ships the Terra repos but leaves them disabled; enable for our builds.
  - type: script
    snippets:
      - dnf5 config-manager enable terra terra-extras terra-mesa

  - type: dnf
    repos:
      cleanup: true
      copr:
        - ilyaz/LACT
        - brycensranch/gpu-screen-recorder-git
        - jackgreiner/lsfg-vk-git
        - bieszczaders/kernel-cachyos-addons
      files:
        - https://repository.mullvad.net/rpm/stable/mullvad.repo
      nonfree: rpmfusion

    remove:
      auto-remove: true
      packages:
        - tuned
        - tuned-ppd
        - hhd
        - hhd-ui
        - gamescope-session-plus

    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        - /var/tmp/rpms/tuned.rpm
        - /var/tmp/rpms/tuned-ppd.rpm
        - /var/tmp/rpms/tuned-utils.rpm
        # --- EXPLICITLY REQUEST TERRA MESA ---
        # Listing these forces DNF to pick the highest version (Terra)
        # and swap out the Fedora stock ones.
        - mesa-dri-drivers
        - mesa-vulkan-drivers
        - mesa-libgbm
        - mesa-libglapi
        # CachyOS Addons
        - ananicy-cpp
        - cachyos-ananicy-rules
        - cachyos-ksm-settings
        - cachyos-settings
        - sbsigntools
        - scx-manager
        - scx-scheds
        - scx-tools
        # Gaming
        - antimicrox
        - inputplumber
        - lsfg-vk
        - lsfg-vk-ui
        # Hardware & Sensors
        - coolercontrol
        - i2c-tools
        - lact
        - liquidctl
        - liquidctl-udev
        - lm_sensors
        - openrgb
        - steam-devices
        # Networking
        - mullvad-vpn
        # Virtual Machine
        - virt-manager
        - podman-compose
        - cargo
        # Multimedia
        - ffmpeg
        - gpu-screen-recorder-ui
        - mpv
        - yt-dlp
        # CLI
        - google-noto-fonts-all
        - atuin
        - bat
        - byobu
        - fd-find
        - ripgrep
        - tealdeer
        - ugrep
        - zoxide

  - type: script
    snippets:
      - dnf5 config-manager disable terra terra-extras terra-mesa

  - type: justfiles
    validate: true
    install: true
    include:
      - 60-boppos.just

  - type: script
    scripts:
      - fix-just-collision.sh
      - install-joystick-blacklist.sh
      - install-warp-wgcf.sh

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        repo:
          title: Flathub (system)
        install:
          - org.mozilla.firefox
          - net.mullvad.MullvadBrowser
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          - io.missioncenter.MissionCenter
          - com.heroicgameslauncher.hgl
          - io.github.Faugus.faugus-launcher
          - com.vysp3r.ProtonPlus
        check: false

  - type: systemd
    system:
      enabled:
        - ananicy-cpp.service
        - inputplumber.service
        - ksmd.service
        - lactd.service
        - libvirtd.service
        - openrgb.service
        - scx_loader.service
      disabled:
        - coolercontrold.service
        - mullvad-daemon.service
        - tailscaled.service
        - warp-svc.service

  - type: kargs
    kargs:
      - iommu=pt
      - preempt=full
      - transparent_hugepage=madvise
      - transparent_hugepage.defrag=defer+madvise
      - amdgpu.ppfeaturemask=0xffffffff
      - amdgpu.gpu_recovery=1
      - split_lock_detect=off
      - zswap.enabled=1
      - skew_tick=1

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - FiraMono
        - Hack
        - SourceCodePro
        - Terminus
        - Meslo
        - Monoid
        - JetBrainsMono
        - DejaVuSansMono
        - NerdFontsSymbolsOnly
      google-fonts:
        - Alegreya
        - Cabin
        - Inter
        - Lato
        - Montserrat
        - Mulish
        - Open Sans
        - Roboto
        - Rubik

  - type: signing
